services:
  app:
    build:
      context: ./laravel-app
    container_name: vehicle-counter-app
    command: ["serve"]
    volumes:
      - app_database:/var/www/html/database/data
      - videos_data:/var/www/html/storage/app/videos
    environment:
      APP_URL: "${APP_URL:-http://localhost:8000}"
      APP_KEY: "${APP_KEY:-}"
      DB_DATABASE: "/var/www/html/database/data/database.sqlite"
      DETECTOR_SERVICE_URL: "http://detector:8001"
      DETECTOR_CALLBACK_SECRET: "${DETECTOR_CALLBACK_SECRET:-change-me-secret}"
      DANGER_DWELL_SECONDS: "${DANGER_DWELL_SECONDS:-5}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_NAME: "${ADMIN_NAME:-Administrator}"
    depends_on:
      - detector

  queue:
    build:
      context: ./laravel-app
    container_name: vehicle-counter-queue
    command: ["queue"]
    volumes:
      - app_database:/var/www/html/database/data
      - videos_data:/var/www/html/storage/app/videos
    environment:
      APP_URL: "${APP_URL:-http://localhost:8000}"
      APP_KEY: "${APP_KEY:-}"
      DB_DATABASE: "/var/www/html/database/data/database.sqlite"
      DETECTOR_SERVICE_URL: "http://detector:8001"
      DETECTOR_CALLBACK_SECRET: "${DETECTOR_CALLBACK_SECRET:-change-me-secret}"
      DANGER_DWELL_SECONDS: "${DANGER_DWELL_SECONDS:-5}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_NAME: "${ADMIN_NAME:-Administrator}"
    depends_on:
      - detector
      - app

  detector:
    build:
      context: ./detector-service
    container_name: vehicle-counter-detector
    volumes:
      - videos_data:/data/videos
    environment:
      CALLBACK_SECRET: "${DETECTOR_CALLBACK_SECRET:-change-me-secret}"
      MODEL_NAME: "${MODEL_NAME:-yolov8n.pt}"
      DANGER_DWELL_SECONDS: "${DANGER_DWELL_SECONDS:-5}"

volumes:
  videos_data:
  app_database:
