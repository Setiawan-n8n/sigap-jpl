services:
  app:
    build:
      context: ./laravel-app
    container_name: vehicle-counter-app
    command: ["serve"]
    volumes:
      - app_database:/var/www/html/database/data
      - videos_data:/var/www/html/storage/app/videos
    environment:
      APP_URL: "${APP_URL:-http://localhost:8000}"
      APP_KEY: "${APP_KEY:-}"
      DB_DATABASE: "/var/www/html/database/data/database.sqlite"
      DETECTOR_SERVICE_URL: "http://detector:8001"
      DETECTOR_CALLBACK_SECRET: "${DETECTOR_CALLBACK_SECRET:-change-me-secret}"
      DANGER_DWELL_SECONDS: "${DANGER_DWELL_SECONDS:-5}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_NAME: "${ADMIN_NAME:-Administrator}"
    depends_on:
      - detector

  queue:
    build:
      context: ./laravel-app
    container_name: vehicle-counter-queue
    command: ["queue"]
    volumes:
      - app_database:/var/www/html/database/data
      - videos_data:/var/www/html/storage/app/videos
    environment:
      APP_URL: "${APP_URL:-http://localhost:8000}"
      APP_KEY: "${APP_KEY:-}"
      DB_DATABASE: "/var/www/html/database/data/database.sqlite"
      DETECTOR_SERVICE_URL: "http://detector:8001"
      DETECTOR_CALLBACK_SECRET: "${DETECTOR_CALLBACK_SECRET:-change-me-secret}"
      DANGER_DWELL_SECONDS: "${DANGER_DWELL_SECONDS:-5}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_NAME: "${ADMIN_NAME:-Administrator}"
    depends_on:
      - detector
      - app

  detector:
    build:
      context: ./detector-service
    container_name: vehicle-counter-detector
    volumes:
      - videos_data:/data/videos
    environment:
      CALLBACK_SECRET: "${DETECTOR_CALLBACK_SECRET:-change-me-secret}"
      MODEL_NAME: "${MODEL_NAME:-yolov8s.pt}"
      DANGER_DWELL_SECONDS: "${DANGER_DWELL_SECONDS:-5}"
      # Redesign 27 Agu 2026 (lihat detector-service/app/main.py &
      # config.py): sesi live sekarang direkam dulu lalu diproses lewat
      # pipeline yang sama dengan mode unggah file -- LIVE_MODEL_NAME &
      # LIVE_IMGSZ (model/ukuran-input ringan khusus live) sudah tidak
      # dipakai lagi & dipensiunkan dari sini. Dua env var di bawah
      # menggantikan peran "trade-off kecepatan vs akurasi yang bisa
      # disetel tanpa build ulang" untuk KEDUA mode sekaligus:
      CONF_THRESHOLD: "${CONF_THRESHOLD:-0.1}"
      DETECT_IMGSZ: "${DETECT_IMGSZ:-640}"

volumes:
  videos_data:
  app_database:
