; Konfigurasi PHP tambahan untuk SIGAP-JPL.
; Default PHP (upload_max_filesize=2M, post_max_size=8M) terlalu kecil
; untuk upload video CCTV -- validasi Laravel mengizinkan hingga 500MB,
; jadi PHP-nya juga harus disesuaikan.

upload_max_filesize = 550M
post_max_size = 550M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
